# Fallback host: same Docker image. Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: darglobal-concierge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "7860"
      - key: LLM_MODE
        value: live
      # 50 free requests/day for the whole account: stop at 45, one call per message, code planner routes.
      - key: LLM_DAILY_BUDGET
        value: "45"
      - key: LLM_TOOL_ROUTING
        value: "false"
      # All five find-my-home journeys (H01 H02 H04 H05 A14) pass in mock, EN + AR (2026-11-19).
      - key: FF_FIND_MY_HOME
        value: "true"
      # Render's edge appends one X-Forwarded-For hop; confirm with GET /readyz -> xff_hops_seen (deploy/README.md).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CANDIDATE_NAME
        sync: false
      - key: CANDIDATE_GITHUB
        sync: false
      - key: CANDIDATE_LINKEDIN
        sync: false
      - key: CANDIDATE_EMAIL
        sync: false
