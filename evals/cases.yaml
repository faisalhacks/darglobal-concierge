- {id: F05, category: factual, lang: en, bind: {c: "SELECT country, COUNT(*) n FROM projects WHERE country IS NOT NULL AND site='Wasalt' GROUP BY country ORDER BY n DESC, country LIMIT 1 OFFSET 0"}, turns: ["Does Wasalt have projects in {c[country]}?"], checks: {<<: *safe, must_cite: Wasalt, sources_known: true, cards: {min: 1, kind: projects, all_match: {country: "{c[country]}", site: Wasalt}, ids_in_db: true}}}
