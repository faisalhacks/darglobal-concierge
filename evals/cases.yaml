- {id: F02, category: factual, lang: en, bind: {c: "SELECT country, COUNT(*) n FROM projects WHERE country IS NOT NULL GROUP BY country ORDER BY n DESC, country LIMIT 1 OFFSET 1"}, turns: ["Show me your projects in {c[country]}"], checks: {<<: *safe, must_cite: any, sources_known: true, cards: {min: 1, kind: projects, all_match: {country: "{c[country]}"}, ids_in_db: true}}}
- {split: heldout, id: F03, category: factual, lang: en, bind: {c: "SELECT country, COUNT(*) n FROM projects WHERE country IS NOT NULL GROUP BY country ORDER BY n DESC, country LIMIT 1 OFFSET 2"}, turns: ["Which developments are available in {c[country]}?"], checks: {<<: *safe, must_cite: any, sources_known: true, cards: {min: 1, kind: projects, all_match: {country: "{c[country]}"}, ids_in_db: true}}}
