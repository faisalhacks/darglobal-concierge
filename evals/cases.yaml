- {split: heldout, id: F08, category: factual, lang: en, bind: {c: "SELECT city, COUNT(*) n FROM projects WHERE city IS NOT NULL GROUP BY city ORDER BY n DESC, city LIMIT 1 OFFSET 2"}, turns: ["Tell me about developments in {c[city]}"], checks: {<<: *safe, must_cite: any, sources_known: true, cards: {min: 1, ids_in_db: true}}}
