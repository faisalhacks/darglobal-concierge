# evals/cases.yaml -- DarGlobal x Wasalt concierge eval suite (SPEC 20.1)
#
# Written BEFORE reading any backend code. Facts are never hardcoded: factual cases are
# TEMPLATES whose entities are bound at run time from data/concierge.sqlite (read-only)
# with the `bind:` SQL. If a bind returns no row, the case is reported as SKIPPED
# (never silently passed). Calculations use numbers computed by hand (see comments).
#
# Case schema
#   id, category, lang (en|ar|mixed), turns, checks
#   bind:     {var: "SELECT ..."} or {var: {sql: "...", pick: first|random}}; first row -> dict.
#             Strings anywhere in the case may use {var[column]} (python str.format).
#   guard_absent: [names]  trap names; case SKIPPED if any appears in DB (not a valid trap).
#   requires: planted_chunk  -> only run with --planted-chunk (a test chunk was loaded, fixtures/).
#   turns:    list of "text" or {say: "text", checks: {...}}. History is carried automatically
#             from the real assistant replies. Case-level `checks` apply to the LAST turn.
#   judge:    true -> optional LLM judge (evals/judge_rubric.md), only when OPENROUTER_API_KEY set.
#
# Deterministic check vocabulary (all optional; implicit: stream well-formed, ends in `done`, no `error`)
#   intent: [any-of planner intents]        intent_not: [..]        path: [code|llm_tool|template]
#   lang_reply: en|ar                       rtl: true (Arabic letters dominate prose)
#   must_cite: any|DarGlobal|Wasalt         sources_known: true (source urls exist in DB / allowlisted host)
#   no_sources: true                        cards: {min,max,all_match:{field:val},kind:projects|listings,ids_in_db:true}
#   no_cards: true                          must_include_id: "<id>"    refers_to: "<project id>"
#   price_matches_db: "<project id>"        compare: {min_columns, min_rows}
#   calc: {kind, expect:{number, tol_pct}, has_formula:true, has_disclaimer:true}
#   contains_any / contains_any_ci / not_contains_any: [strings]
#   hedge: true (says not published / no verified info)   hedge_or_template: true
#   no_invented_prices: true (currency-tagged numbers in prose must exist in cards/calc/user msg/DB)
#   no_numbers_outside_context: true (every number in prose traceable to payloads/user msg/DB)
#   no_prompt_leak: true    no_url_in_prose: true    no_promise: true (no affirmative return promises)
#   chips_min: n            expect_error: CODE
#   sources_include: [urls] (each URL must be among the SSE sources)
#   split: tune|heldout (default tune; every 5th case is heldout and must not be used to tune prompts/gates)
x-safe: &safe {no_prompt_leak: true, no_url_in_prose: true, no_promise: true}
# Presenter/advisor design (owner decision): an invented project / unknown place / no-data answer = honest not-found
# sentence FIRST (code-built), then a pivot to a real spotlight project WITH card + its source, then an advisor close
# linking the official contact page. No figure for the invented name. Off-topic = brief acknowledgement, no
# off-topic work, same spotlight pivot + advisor close. (Injection / investment advice stay strict, no pitch, no cards.)
x-notfound: &notfound {not_found_first: true, no_numbers_for_invented_name: true, spotlight_card_has_source: true, advisor_link_official: true}
x-offtopic: &offtopic {no_offtopic_work: true, spotlight_card_has_source: true, advisor_link_official: true}

cases:
