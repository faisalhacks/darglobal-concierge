# evals/conversations_30.yaml -- FROZEN multi-turn eval set for the quality round.
# Frozen BEFORE any quality code change. The same file and the same provider (EVAL_LLM_PROVIDER=nvidia) drive the
# before-run (untouched snapshot) and the after-run. Do not edit between runs; add a new file instead.
#
# 60 conversations were planned; 30 are used (council cut, stated in the report). 30 x 3 turns = 90 turns.
#
# Quotas inside the 30
#   categories: filtered_search_refine 4 | superlative 4 | reference 5 | project_facts 3 | false_premise 3 | vague_opener 2
#               | site_confusion 2 | advice_legal_availability 3 | typo_translit 2 | meta_trust 2
#   tags:       ar (Gulf register) = 9 | typo = 5 | switch (reset or topic switch mid-conversation) = 4
#
# Playbook ids (owner override: 32, not 16). Each conversation carries one `playbook`; a turn may override it.
#   filtered_search refine superlative best_value rent_vs_buy near_amenity project_facts single_attribute compare
#   brand_partner country_overview site_confusion greeting thanks_goodbye identity capabilities vague_opener banter
#   followup_reference topic_switch calculation currency price_not_published unrealistic_budget invented_or_false_premise
#   adjacent investment_advice injection steering off_topic interest_handoff availability_booking
#   Ids with no conversation here (near_amenity, rent_vs_buy, calculation, currency, price_not_published, unrealistic_budget,
#   injection, steering, interest_handoff, greeting, capabilities, topic_switch as primary) are covered by the 177-case mock suite.
#
# DEFAULT checks on every turn (run_conversations.py): stream_ok, empty_content, numbers_traceable, country_city,
#   no_dead_end, lang_match. Turn `checks:` add to or override them (`name: false` switches a default off).
# Optional checks (also not_regex, hedge_or_date): cards_min, cards_city, cards_country, cards_site, cards_property, sorted (asc|desc), no_blog_source,
#   ref {pick:[1-based positions into the previous turn's cards]}, cheaper_than_prev, contains_any_ci, not_contains_any_ci,
#   hedge, cards_or_hedge, no_cards, no_promise, allowed_countries (extra countries the reply may name), reply_lang (any|en|ar).
# Judge (optional, Gemini): helpfulness and tone, 1-5. Stated limit: weak on Gulf dialect, never overrides a check.

version: 1
conversations:

